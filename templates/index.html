<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #e9eef3;
      --panel: #ffffff;
      --ink: #14233a;
      --muted: #6b7a90;
      --line: #d9e1ea;
      --accent: #1f5eff;
      --accent-dark: #1746c4;
      --bot-bubble: #f0f4f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .chat {
      width: 100%;
      max-width: 760px;
      height: 100%;
      max-height: 860px;
      background: var(--panel);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(20, 35, 58, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px 24px;
      background: var(--ink);
      color: #fff;
    }
    .header h1 { font-size: 1.15rem; font-weight: 700; }
    .header p { font-size: 0.85rem; color: #a9b8cf; margin-top: 2px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }
    .message.error { background: #fde8e8; color: #9b1c1c; }

    .message.bot p { margin-bottom: 8px; }
    .message.bot p:last-child { margin-bottom: 0; }
    .message.bot ul { margin: 6px 0 8px 20px; }
    .message.bot code {
      background: #dde5ef;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.88em;
    }

    .typing { display: flex; gap: 5px; padding: 16px; }
    .typing span {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 24px 12px;
    }
    .suggestions button {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .suggestions button:hover { border-color: var(--accent); color: var(--accent); }

    .input-bar {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--line);
    }
    .input-bar input {
      flex: 1;
      font-family: inherit;
      font-size: 0.95rem;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
    }
    .input-bar input:focus { border-color: var(--accent); }
    .input-bar button {
      font-family: inherit;
      font-weight: 600;
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .input-bar button:hover { background: var(--accent-dark); }
    .input-bar button:disabled { opacity: 0.6; cursor: not-allowed; }

    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 600px) {
      body { padding: 0; }
      .chat { border-radius: 0; max-height: none; }
      .message { max-width: 92%; }
    }
  </style>
</head>

<body>
  <div class="chat">
    <div class="header">
      <h1>Interview Coach</h1>
      <p>Practice questions, mock interviews and answer feedback</p>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Hi! I'm your interview coach. Ask me about interview questions, run a mock interview with me, or get feedback on your answers.
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button>How do I answer "Tell me about yourself"?</button>
      <button>Start a mock HR interview</button>
      <button>Explain the STAR method</button>
      <button>Questions to ask the interviewer</button>
    </div>

    <div class="input-bar">
      <input type="text" id="input" placeholder="Ask about interview preparation..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const suggestionsEl = document.getElementById("suggestions");

    let history = [];

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    // Turns the bot's simple markdown (bold, code, bullet lists) into safe HTML.
    function formatReply(text) {
      const lines = escapeHtml(text).split("\n");
      let html = "";
      let inList = false;

      for (const line of lines) {
        const bullet = line.match(/^\s*[-*]\s+(.*)/);
        if (bullet) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += `<li>${inline(bullet[1])}</li>`;
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line.trim()) html += `<p>${inline(line)}</p>`;
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    function inline(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = `message ${type}`;
      if (type === "bot") {
        div.innerHTML = formatReply(text);
      } else {
        div.textContent = text;
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message bot typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message) return;

      suggestionsEl.style.display = "none";
      addMessage(message, "user");
      inputEl.value = "";
      sendBtn.disabled = true;
      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage(data.error || "Something went wrong.", "bot error");
        } else {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text: message });
          history.push({ role: "model", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("Could not reach the server. Please try again.", "bot error");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    sendBtn.addEventListener("click", () => sendMessage(inputEl.value));
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage(inputEl.value);
    });
    suggestionsEl.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });
  </script>
</body>
</html>
